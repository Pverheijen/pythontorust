{% macro header(components, is_page) %}
<header class="sticky top-0 z-30 border-b border-slate-200/80 bg-slate-100/95 backdrop-blur dark:border-slate-700 dark:bg-slate-800/90">
    <div class="container mx-auto flex items-center justify-between gap-4 py-3 text-base font-sans text-slate-900 dark:text-slate-200">
        <nav class="min-w-0" aria-label="Breadcrumb">
            <div class="flex min-w-0 items-center gap-1 overflow-hidden whitespace-nowrap">
            {% set_global rel_url = "/" %}
            {% for component in components %}
            {% set_global rel_url = rel_url ~ component ~ '/' %}
            {% if not loop.last %}
            <a class="truncate text-slate-700 hover:text-slate-900 dark:text-slate-300 dark:hover:text-white" href="{{ rel_url }}">
                /{{ component }}
            </a>
            {% elif is_page %}
            {% else %}
            <div class="truncate text-slate-500 dark:text-slate-300" aria-current="page">
                /{{ component }}
            </div>
            {% endif %}
            {% endfor %}
            </div>
        </nav>
        <div class="flex shrink-0 items-center gap-1">
            <button id="back-to-top" class="icon-button hidden" aria-label="Back to top" type="button" title="Back to top">
                <i class="las la-level-up-alt"></i>
            </button>
            <a href="/" class="icon-button" aria-label="Go to homepage" title="Home"><i class="las la-home"></i></a>
            <button id="darkmode-toggle" class="icon-button" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
                <div class="hidden dark:inline">
                    <i class="las la-sun"></i>
                </div>
                <div class="inline dark:hidden">
                    <i class="las la-moon"></i>
                </div>
            </button>
        </div>
    </div>
</header>
{% endmacro header %}
