<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="color-scheme" content="light dark">
        
        <script defer data-domain="pythontorust.nl" src="https://plausible.io/js/script.js"></script>

        {% set gtag_id = config.extra.google_analytics_measurement_id %}
        {% if gtag_id %}
            <!-- Google tag (gtag.js) -->
            <script async src="https://www.googletagmanager.com/gtag/js?id={{ gtag_id }}"></script>
            <script>
                window.dataLayer = window.dataLayer || [];
                function gtag(){dataLayer.push(arguments);}
                gtag("js", new Date());

                gtag("config", "{{ gtag_id }}");
            </script>
        {% endif %}

        <link rel="stylesheet" href="/css/style.css"/>
        <link rel="stylesheet" href="/line-awesome/css/line-awesome.min.css"/>
        <script src="/js/main.js" defer></script>
        {% block head_extend %}{% endblock %}
    </head>

    <body class="site-shell transition-colors duration-300 ease-in-out">
        <a href="#main-content" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-50 focus:rounded-md focus:bg-white focus:px-3 focus:py-2 focus:text-slate-900 dark:focus:bg-slate-800 dark:focus:text-slate-100">
            Skip to content
        </a>
        <main id="main-content" class="min-h-screen">
            {% block content %}{% endblock %}
        </main>
    </body>
</html>
